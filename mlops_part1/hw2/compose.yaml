services:
  app:
    build: .
    container_name: app
    ports:
      - "${TEST_PORT}:9998"
    environment:
      POSTGRES_DB: myapp
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
      - shared-network  
  
  db:
    image: postgres:15
    container_name: db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: myapp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d myapp"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
  
  extra:
    image: alpine:latest
    container_name: extra
    command: sleep infinity
    networks:
      - extra-network
      - shared-network  

networks:
  app-network:
  extra-network:
  shared-network:  

volumes:
  postgres_data: